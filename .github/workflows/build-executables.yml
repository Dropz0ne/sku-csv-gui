name: Build and Release Executables

# Runs whenever you push to main, or manually from the Actions tab
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Needed so the built-in GITHUB_TOKEN is allowed to create releases
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install PySide6 pyinstaller

      - name: Build .exe
        run: pyinstaller --onefile --windowed --name SKU_CSV_Generator sku_csv_gui.py

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SKU_CSV_Generator-windows
          path: dist/SKU_CSV_Generator.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries Qt needs at runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libegl1

      - name: Install dependencies
        run: pip install PySide6 pyinstaller

      - name: Build Linux binary
        run: pyinstaller --onefile --windowed --name SKU_CSV_Generator sku_csv_gui.py

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: SKU_CSV_Generator-linux
          path: dist/SKU_CSV_Generator

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      # Downloads every artifact from this run into artifacts/<artifact-name>/...
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show downloaded files
        run: ls -R artifacts

      - name: Create GitHub Release with both builds attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            artifacts/SKU_CSV_Generator-windows/SKU_CSV_Generator.exe
            artifacts/SKU_CSV_Generator-linux/SKU_CSV_Generator
